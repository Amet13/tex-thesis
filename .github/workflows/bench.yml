# Monthly reference-check benchmark against the live indexes.
# The job summary shows the table, the results file is uploaded as an artifact, and
# a pull request with bench/refs/results.json is opened and merged when CI passes.
name: bench

on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  refs:
    name: Reference check benchmark
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Run the benchmark (live network)
        # Optional secrets: without them the keyless OpenAlex and Semantic Scholar budgets,
        # shared by every job on the runner's IP address, may run out mid-run.
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OVERFULL_MAILTO: ${{ vars.OVERFULL_MAILTO }}
        run: node bench/refs/run.mjs --summary "$GITHUB_STEP_SUMMARY"
      # A complete live run is published: a pull request with results.json, merged by
      # automerge.yml when CI passes. The site's accuracy page renders it.
      - name: Open a pull request with the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Monthly reference-check benchmark, run $GITHUB_RUN_ID, against the live indexes."
            echo
            echo "The accuracy page (docs/guide/accuracy.md) renders these numbers."
          } > "$RUNNER_TEMP/body.md"
          bash .github/scripts/automation-pr.sh benchmark "Benchmark results ($(date -u +%Y-%m-%d))" "$RUNNER_TEMP/body.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/refs/results.json
          if-no-files-found: error
