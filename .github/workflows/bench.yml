# Monthly reference-check benchmark against the live indexes.
# It does not commit anything: the job summary shows the table and the results file
# is uploaded as an artifact. To publish a run, download results.json and commit it
# as bench/refs/results.json in a pull request.
name: bench

on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  refs:
    name: Reference check benchmark
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the benchmark (live network)
        run: node bench/refs/run.mjs --summary "$GITHUB_STEP_SUMMARY"
      - name: How to publish this run
        run: |
          {
            echo
            echo "To publish: download the \`bench-results\` artifact and commit it as"
            echo "\`bench/refs/results.json\` in a pull request."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/refs/results.json
          if-no-files-found: error
