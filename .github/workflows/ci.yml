name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, types, unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Templates are in sync with skills/ and shared/
        run: pnpm templates:check
      - name: Venue profiles are valid and the generated module is current
        run: pnpm venues:check
      - name: Every eval task and variant can be prepared
        run: node evals/run.mjs --dry-run
      - name: The image pins the same pnpm as packageManager
        run: |
          want="$(jq -r .packageManager package.json)"
          got="pnpm@$(jq -r .dependencies.pnpm docker/pnpm/package.json)"
          [ "$want" = "$got" ] || { echo "::error file=docker/pnpm/package.json::$got, packageManager is $want"; exit 1; }
          jq -e --arg v "${want#pnpm@}" '.packages["node_modules/pnpm"].version == $v' docker/pnpm/package-lock.json > /dev/null
      - name: Version bump script still finds every version
        run: node scripts/bump-version.mjs 99.0.0 --dry-run > /dev/null
      - name: Bundled Action is up to date
        run: |
          pnpm --filter overfull-action build
          git diff --exit-code -- action/dist

  cross-os:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Keep LF line endings on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Standalone CLI runs and creates a project
        shell: bash
        run: |
          node scripts/build-standalone.mjs
          node dist-standalone/overfull.cjs --version
          node dist-standalone/overfull.cjs init paper "$RUNNER_TEMP/sa-paper" --no-git
          test -f "$RUNNER_TEMP/sa-paper/main.tex"
          test -f "$RUNNER_TEMP/sa-paper/.agents/skills/add-citation/SKILL.md"

  changes:
    name: What changed
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tex: ${{ steps.diff.outputs.tex }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The TeX job builds a 3 GB image and every template (about 10 minutes).
      # Pull requests that touch only the website or prose skip it; pushes to
      # main always run it.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tex=true
          if [ "$EVENT" = pull_request ]; then
            files="$(git diff --name-only "$BASE...$HEAD")"
            echo "$files"
            if [ -n "$files" ] && ! grep -qvE '^(site/|docs/|evals/|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)' <<< "$files"; then
              tex=false
            fi
          fi
          echo "tex=$tex" >> "$GITHUB_OUTPUT"
          echo "TeX job: $tex"

  tex:
    name: Image, corpus, templates, Action
    needs: changes
    if: needs.changes.outputs.tex == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Overfull image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: overfull
          load: true
          tags: overfull:ci
          # Same cache as image.yml's amd64 build: PRs reuse the layers from main.
          cache-from: type=gha,scope=overfull-linux-amd64
          cache-to: type=gha,scope=overfull-linux-amd64,mode=max
      - name: Build the check-only image (no TeX Live)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: check
          load: true
          tags: overfull:ci-check
          cache-from: type=gha,scope=check-linux-amd64
      - name: The check-only image checks a built project and has no TeX
        run: |
          docker run --rm overfull:ci-check sh -c 'overfull --version && verapdf --version && ! command -v lualatex'
          code=0
          docker run --rm -v "$PWD/packages/cli/test/fixtures/project:/work" -w /work \
            overfull:ci-check overfull check --offline || code=$?
          echo "overfull check exit code: $code"
          test "$code" -le 1
      - name: Build the medium image (TeX Live medium scheme)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: overfull
          build-args: TEX_FLAVOR=medium
          load: true
          tags: overfull:ci-medium
          cache-from: type=gha,scope=medium-linux-amd64
      - name: Templates build and pass their own preflight in the medium image
        run: bash scripts/e2e-templates.sh overfull:ci-medium out-medium
      - name: Corpus reproduces every rule on TeX Live 2026
        run: docker run --rm -v "$PWD:/repo" -w /repo -e OVERFULL_TEX_LOCAL=1 overfull:ci node scripts/corpus.mjs --verify
      - name: Templates build and pass their own preflight
        run: bash scripts/e2e-templates.sh overfull:ci out
      - name: Action runs on a built template
        id: action
        uses: ./
        with:
          working-directory: out/thesis
          checks: build,output,references,accessibility,venue
          fail-on: error
      - name: Action reported a status
        run: test -n "${{ steps.action.outputs.status }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: template-pdfs
          path: |
            out/*/*.pdf
            out/*/overfull-report.json
          if-no-files-found: ignore

  site:
    name: Website
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @overfull/core build
      - run: pnpm --filter site check
      - run: pnpm --filter site build
      - run: pnpm --filter site exec playwright install --with-deps chromium
      - run: pnpm --filter site test:e2e

  installers:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh
        if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
