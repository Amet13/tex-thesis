name: release

# Tag vX.Y.Z → GitHub release with:
#   - overfull.cjs                      single-file CLI, runs with Node ≥ 26 on any OS
#   - overfull-<os>-<arch>[.exe]        native executables (Node single executable):
#                                       linux-x64, linux-arm64, darwin-arm64, darwin-x64, win-x64
#   - thesis.pdf, paper.pdf, slides.pdf template PDFs built in the Docker image
#   - SHA256SUMS                        checksums, plus build provenance attestations
#   - overfull.intoto.sigstore.json     the signed provenance (Sigstore bundle) for every file
#   - overfull.intoto.jsonl             the same provenance as an in-toto DSSE envelope (SLSA)
#
# Two ways to release the version in package.json (bump it first with
# scripts/bump-version.mjs):
#   - Actions → release → Run workflow on main, with "publish" ticked. It checks
#     that CI passed on that commit, builds everything, creates the vX.Y.Z tag
#     and release, moves the major tag (v3) and publishes the Docker image.
#   - Or push a vX.Y.Z tag; image.yml then publishes the image itself.
# Run workflow without "publish" is a dry run from any branch: every asset is
# built and kept as a workflow artifact, nothing is published.

on:
  push:
    # Release tags only: moving the major tag (v3) for the Action triggers nothing.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (main only). Unticked = dry run.
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version and release checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Every package has the same version (and it matches the tag)
        run: |
          version="$(jq -r .version packages/cli/package.json)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, package version $version (run scripts/bump-version.mjs)"; exit 1
          fi
          for f in packages/core/package.json action/package.json; do
            got="$(jq -r .version "$f")"
            [ "$got" = "$version" ] || { echo "::error file=$f::version $got, expected $version (run scripts/bump-version.mjs)"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publishing is allowed
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::publish only from main (this run is on $GITHUB_REF_NAME)"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::v$VERSION is already released; bump the version first (scripts/bump-version.mjs)"; exit 1
          fi
          # A merge made by automation starts ci with workflow_dispatch, not push.
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA" --jq '[.workflow_runs[] | select(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | length')"
          [ "$ci" -gt 0 ] || { echo "::error::ci has not passed on $GITHUB_SHA yet; wait for it, then run again"; exit 1; }
          echo "Publishing v$VERSION from $GITHUB_SHA"

  pdfs:
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: overfull
          load: true
          tags: overfull:release
          cache-from: type=gha,scope=overfull-linux-amd64
      - run: bash scripts/e2e-templates.sh overfull:release out
      - name: Collect PDFs
        run: |
          mkdir -p assets
          cp out/thesis/thesis.pdf out/paper/paper.pdf out/slides/slides.pdf assets/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-pdfs
          path: assets/*

  cli:
    name: CLI (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, target: linux-x64 }
          - { os: ubuntu-26.04-arm, target: linux-arm64 }
          - { os: macos-26, target: darwin-arm64 }
          - { os: macos-26-intel, target: darwin-x64 }
          - { os: windows-2025, target: win-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # The executables embed this Node.js (26 LTS), which builds them in one
      # step with `--build-sea`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-standalone.mjs --sea
      - name: Smoke test
        shell: bash
        run: |
          exe=dist-standalone/overfull; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" explain undefined-control-sequence > /dev/null
          "$exe" init paper "$RUNNER_TEMP/sea-paper" --no-git > /dev/null
          test -f "$RUNNER_TEMP/sea-paper/main.tex"
          node dist-standalone/overfull.cjs --version
      - name: Name assets
        shell: bash
        run: |
          mkdir -p assets
          if [ -f dist-standalone/overfull.exe ]; then
            cp dist-standalone/overfull.exe "assets/overfull-${{ matrix.target }}.exe"
          else
            cp dist-standalone/overfull "assets/overfull-${{ matrix.target }}"
          fi
          if [ "${{ matrix.target }}" = linux-x64 ]; then cp dist-standalone/overfull.cjs assets/; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-cli-${{ matrix.target }}
          path: assets/*

  github-release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [version, pdfs, cli]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          merge-multiple: true
          path: assets
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS
      - name: Homebrew formula and Scoop manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node src/packaging/generate.mjs --version "$VERSION" --sums assets/SHA256SUMS --out assets
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      # Also ship the signed provenance as a release file, so it can be checked
      # offline (`gh attestation verify --bundle`) and found by OpenSSF Scorecard.
      - name: Attach the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" assets/overfull.intoto.sigstore.json
          # The in-toto envelope on its own line, the format SLSA tooling and OpenSSF
          # Scorecard (Signed-Releases) recognise as provenance.
          jq -c '.dsseEnvelope' "$BUNDLE" > assets/overfull.intoto.jsonl
          test -s assets/overfull.intoto.jsonl
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Creates the tag at this commit when the release comes from Run workflow.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: assets/*
      - name: "Move the major tag (v3) that `uses: amet13/overfull@v3` reads"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          major="v${VERSION%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" > /dev/null
          fi
          echo "$major → $GITHUB_SHA"

  # A tag pushed by hand starts image.yml itself; a release made with Run
  # workflow calls it here.
  image:
    if: inputs.publish
    needs: [version, github-release]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.version.outputs.version }}
