version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/templates/thesis", "/templates/paper", "/templates/slides"]
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directories: ["/", "/docker/pnpm"]
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # astro check (site) does not support TypeScript 7 yet; review majors by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # pnpm is pinned twice (packageManager and docker/pnpm) and must match;
      # update-pins.yml bumps both together.
      - dependency-name: "pnpm"
    groups:
      npm:
        patterns: ["*"]
