textBlock:
  widthMm: 181.4
notes: >-
  Each IEEE conference sets its own page limit, paper size and review rules; set them in
  overfull.yml (`venue:`) from the call for papers. IEEE's submission policies ask authors to
  disclose AI-generated content in the acknowledgments (editing and grammar help excepted),
  so the disclosure is recommended rather than required. IEEE Xplore needs every font
  embedded. The hash is of IEEEtran.cls V1.8b (2015/08/26) as distributed on CTAN, the
  current release; IEEE's own template page could not be read from the build machine. The
  text block is the class's conference-mode width (43 pc, centred).
